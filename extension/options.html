<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Visual Browser Agent Settings</title>
    <style>
      body { font: 15px system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; }
      label { display: block; margin: 18px 0 6px; font-weight: 600; }
      input[type=url] { width: 100%; box-sizing: border-box; padding: 10px; }
      button { margin-top: 20px; padding: 10px 16px; }
      #status { color: #176b37; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <h1>Visual Browser Agent</h1>
    <p>Choose where navigation events are stored.</p>
    <label for="backendUrl">Backend URL</label>
    <input id="backendUrl" type="url" required>
    <label><input id="enabled" type="checkbox"> Enable tracking</label>
    <button id="save">Save settings</button>
    <p id="status" role="status"></p>
    <script src="options.js"></script>
  </body>
</html>
